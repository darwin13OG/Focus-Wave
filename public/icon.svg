<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(6,182,212,0.25)" stroke-width="4" />

  <!-- Ambient Wave Graphic -->
  <g transform="translate(64, 64) scale(0.75)" filter="url(#glow)">
    <!-- Outer wave pulse -->
    <path d="M 40 256 C 100 160, 160 160, 220 256 C 280 352, 340 352, 400 256 C 460 160, 480 180, 500 256" 
          fill="none" stroke="rgba(6,182,212,0.3)" stroke-width="16" stroke-linecap="round" />

    <!-- Main Dynamic Sound Wave -->
    <path d="M 20 256 C 80 120, 150 120, 210 256 C 270 392, 340 392, 400 256 C 450 140, 490 160, 512 256" 
          fill="none" stroke="url(#wave-grad)" stroke-width="28" stroke-linecap="round" />

    <!-- Central Focus Zen Ring -->
    <circle cx="256" cy="256" r="32" fill="#06b6d4" opacity="0.9" />
    <circle cx="256" cy="256" r="16" fill="#ffffff" />
  </g>
</svg>
