<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-mask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="wave-mask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>
  <!-- Full bleed background for maskable icon -->
  <rect width="512" height="512" fill="url(#bg-mask)" />
  
  <!-- Safe area centered graphics (within 80% circle) -->
  <g transform="translate(102, 102) scale(0.6)">
    <path d="M 20 256 C 80 120, 150 120, 210 256 C 270 392, 340 392, 400 256 C 450 140, 490 160, 512 256" 
          fill="none" stroke="url(#wave-mask)" stroke-width="32" stroke-linecap="round" />
    <circle cx="256" cy="256" r="40" fill="#06b6d4" />
    <circle cx="256" cy="256" r="20" fill="#ffffff" />
  </g>
</svg>
